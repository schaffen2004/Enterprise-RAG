services:
  postgres:
    image: postgres:11
    container_name: rag-db
    environment:
      POSTGRES_DB: ${RAG_DB_NAME}
      POSTGRES_USER: ${RAG_DB_USER:?RAG_DB_USER is required}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?RAG_DB_PASSWORD is required}
    ports:
      - "${RAG_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  adminer:
    container_name: rag_adminer
    image: adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT}:${ADMINER_PORT}"
    networks:
      - rag_network

volumes:
  postgres_data:

networks:
  rag_network:
    name: rag_network
    driver: bridge